name: M2 Workflow

on:
  push:
    branches: [ dev ]

jobs:
  run-mlflow-experiments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for DVC to work properly

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DVC initialization
        run: python dvc_init.py
      
      - name: Run MLflow experiments
        run: python model_with_mlflow.py

      - name: Commit and push mlruns
        env:
          TOKEN: ${{ secrets.COMMIT_TOKEN }}
        run: |
          git config --global user.name "Meet Soni"
          git config --global user.email "meetsoni1998@gmail.com"
          git add mlruns || echo "No changes to add"
          git commit -m "Add mlruns from workflow run" || echo "No changes to commit"
          git push "https://kashyapMeetSoni:$TOKEN@github.com/kashyapMeetSoni/mlops-m2.git" dev || echo "No changes to push"
