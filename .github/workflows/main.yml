name: M2 Workflow

on:
  push:
    branches: [ dev ]

jobs:
  run-mlflow-experiments:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Fetch all history for DVC to work properly

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run DVC initialization
        run: python dvc_init.py
      
      - name: Run MLflow experiments
        run: python model_with_mlflow.py
